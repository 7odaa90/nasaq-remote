name: Package Nasaq Remote MSIX (Microsoft Store)

# Packages the Windows app from a finished "Build Nasaq Remote" run, so it takes minutes, not a full rebuild.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run id of the build that produced rustdesk-unsigned-windows-x86_64
        required: true
        default: "40466838302"

permissions:
  actions: read
  contents: read

jobs:
  msix:
    runs-on: windows-2022
    env:
      PACKAGE_NAME: nasaq-remote-1.5.1-x64
      PACKAGE_ID: Nasaq.NasaqRemote
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download the built app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.source_run }} -n rustdesk-unsigned-windows-x86_64 -D pkg
          Copy-Item res\msix\AppxManifest.xml pkg\AppxManifest.xml
          Copy-Item res\msix\Assets pkg\Assets -Recurse
          Get-ChildItem pkg | Select-Object Name

      - name: Pack for the Store (Microsoft signs this one)
        run: |
          $kit = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1).Directory.FullName
          "$kit" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$kit\makeappx.exe" pack /o /d pkg /p "$env:PACKAGE_NAME-store.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Make a test copy with a throwaway certificate
        run: |
          $publisher = ([xml](Get-Content res\msix\AppxManifest.xml)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName "Nasaq Remote TEST ONLY" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Copy-Item "$env:PACKAGE_NAME-store.msix" "$env:PACKAGE_NAME-test.msix"
          signtool sign /fd SHA256 /sha1 $cert.Thumbprint "$env:PACKAGE_NAME-test.msix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Export-Certificate -Cert $cert -FilePath nasaq-remote-test.cer | Out-Null

      - name: Smoke test on this Windows machine
        shell: powershell   # the Appx cmdlets don't work in pwsh
        run: |
          Import-Certificate -FilePath nasaq-remote-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage "$env:PACKAGE_NAME-test.msix"
          $app = Get-AppxPackage $env:PACKAGE_ID
          if (-not $app) { Write-Error "Package did not install"; exit 1 }
          "Installed: $($app.PackageFullName)"
          "Family: $($app.PackageFamilyName)"
          Start-Process "shell:AppsFolder\$($app.PackageFamilyName)!NasaqRemote"
          Start-Sleep -Seconds 30
          $running = Get-Process rustdesk -ErrorAction SilentlyContinue
          if (-not $running) { Write-Error "App is not running after launch"; exit 1 }
          $running | Select-Object Id, ProcessName, Path | Format-Table -AutoSize | Out-String -Width 200

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nasaq-remote-msix
          path: |
            ${{ env.PACKAGE_NAME }}-store.msix
            ${{ env.PACKAGE_NAME }}-test.msix
            nasaq-remote-test.cer
